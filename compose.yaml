name: zonk-fun

services:
  postgres:
    image: postgres:17-alpine
    container_name: zonk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - zonk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: zonk-redis
    restart: unless-stopped
    volumes:
      - zonk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_LOCAL_DIR: /data/zonk-objects
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - zonk_object_data:/data/zonk-objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    restart: unless-stopped
    environment:
      INDEXER_MODE: ${INDEXER_MODE:-idle}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-}
      INDEXER_STOP_BLOCK: ${INDEXER_STOP_BLOCK:-}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-6}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-500}
      INDEXER_RPC_MAX_ATTEMPTS: ${INDEXER_RPC_MAX_ATTEMPTS:-3}
      INDEXER_RPC_INITIAL_DELAY_MS: ${INDEXER_RPC_INITIAL_DELAY_MS:-100}
      INDEXER_RPC_MAX_DELAY_MS: ${INDEXER_RPC_MAX_DELAY_MS:-2000}
      ZONK_INDEXER_CONTRACTS: ${ZONK_INDEXER_CONTRACTS:-}
      ZONK_FACTORY_ADDRESS: ${ZONK_FACTORY_ADDRESS:-}
      ZONK_CURVE_ADDRESS: ${ZONK_CURVE_ADDRESS:-}
      FEE_MANAGER_ADDRESS: ${FEE_MANAGER_ADDRESS:-}
      LIQUIDITY_MANAGER_ADDRESS: ${LIQUIDITY_MANAGER_ADDRESS:-}
      LP_LOCKER_ADDRESS: ${LP_LOCKER_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:?NEXT_PUBLIC_PRIVY_APP_ID must be set}
        NEXT_PUBLIC_ZONK_FACTORY_ADDRESS: ${NEXT_PUBLIC_ZONK_FACTORY_ADDRESS:?NEXT_PUBLIC_ZONK_FACTORY_ADDRESS must be set}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000}
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:?NEXT_PUBLIC_PRIVY_APP_ID must be set}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  zonk_postgres_data:
  zonk_redis_data:
  zonk_object_data:
